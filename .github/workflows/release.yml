name: Build & Release

# Build the k8sight desktop app for macOS, Windows and Linux in parallel, then
# create a GitHub Release with the installers attached. You never create the
# release by hand — the workflow builds first and publishes for you. Trigger it
# either way:
#   * push a version tag (e.g. `git push origin v1.4.1`), or
#   * Actions -> Build & Release -> Run workflow, and type the version (e.g.
#     v1.4.1); the workflow creates that tag + release at the current commit.
# A manual run with an empty version just builds artifacts (no release).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build & release (e.g. v1.4.1). Leave empty to only build artifacts.'
        required: false
        type: string

permissions:
  contents: write

# Only one release run per ref at a time; cancel superseded runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Build every platform even if one fails, so a single flaky OS doesn't
      # block the others. Each matrix leg runs on its own runner in parallel.
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple Silicon, so the arm64 .dmg builds natively.
          - os: macos-14
            name: macOS (arm64)
            artifact: mac
          - os: windows-latest
            name: Windows (x64)
            artifact: windows
          - os: ubuntu-latest
            name: Linux (x64)
            artifact: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build & package
        # `npm run dist` runs the client build then electron-builder for the
        # host OS. --publish never keeps electron-builder from uploading; the
        # dedicated release job below handles publishing.
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8sight-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Publish for a pushed tag, or a manual run where a version was given.
    # A manual run with an empty version skips this job (build artifacts only).
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # For a manual run, create this tag + release at the current commit;
          # for a tag push, reuse the pushed tag.
          tag_name: ${{ inputs.version || github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
