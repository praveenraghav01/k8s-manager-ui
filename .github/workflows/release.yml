name: Build & Release

# Build the k8sight desktop app for macOS, Windows and Linux in parallel, then
# attach the installers to a GitHub Release. Push a version tag (e.g. v1.4.0)
# to build AND publish a release; run manually from the Actions tab to just
# produce the build artifacts without publishing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

# Only one release run per ref at a time; cancel superseded runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Build every platform even if one fails, so a single flaky OS doesn't
      # block the others. Each matrix leg runs on its own runner in parallel.
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple Silicon, so the arm64 .dmg builds natively.
          - os: macos-14
            name: macOS (arm64)
            artifact: mac
          - os: windows-latest
            name: Windows (x64)
            artifact: windows
          - os: ubuntu-latest
            name: Linux (x64)
            artifact: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build & package
        # `npm run dist` runs the client build then electron-builder for the
        # host OS. --publish never keeps electron-builder from uploading; the
        # dedicated release job below handles publishing.
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8sight-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish for tag pushes; manual runs stop after producing artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
