<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>k8sight — Walkthrough</title>
<meta name="description" content="A self-playing walkthrough of k8sight — a native desktop UI for Kubernetes." />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #050506;
    --panel: #0e0e11;
    --border: #26262b;
    --text: #f2f2f4;
    --text-dim: #a6a6ad;
    --brand-light: #ffffff;
    --brand-dark: #8a8a92;
    --accent: #5F7FFF;
    --dur: 6000ms;              /* per-scene duration (kept in sync with JS) */
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }

  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 600px at 12% -10%, rgba(95,127,255,.14), transparent 60%),
      radial-gradient(900px 700px at 100% 110%, rgba(255,255,255,.06), transparent 55%);
  }

  .stage {
    position: relative; z-index: 1; height: 100%;
    display: grid; grid-template-rows: 1fr auto;
    padding: clamp(20px, 4vw, 56px);
  }

  /* ---- Slides ---- */
  .slides { position: relative; min-height: 0; }
  .slide {
    position: absolute; inset: 0; display: grid; place-items: center;
    opacity: 0; visibility: hidden; transition: opacity .8s var(--ease), visibility .8s;
  }
  .slide.active { opacity: 1; visibility: visible; }

  .shot {
    position: relative; width: min(100%, 1180px); aspect-ratio: 2946 / 1760;
    border-radius: 16px; overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 50px 130px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04) inset;
    background: var(--panel);
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  /* Ken Burns — only on the active slide's image */
  .slide.active .shot img { animation: kb var(--dur) linear both; }
  @keyframes kb { from { transform: scale(1.005); } to { transform: scale(1.075); } }

  /* Caption overlay */
  .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 30px 26px 22px; text-align: left;
    background: linear-gradient(to top, rgba(3,3,4,.92), rgba(3,3,4,.55) 55%, transparent);
  }
  .cap .kicker { font-size: 12.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  .cap h2 { font-size: clamp(20px, 3.2vw, 34px); letter-spacing: -.02em; line-height: 1.1; margin: 8px 0 6px; }
  .cap p { color: var(--text-dim); font-size: clamp(13px, 1.6vw, 16px); max-width: 62ch; }
  .cap kbd { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: .85em; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 6px; padding: 1px 7px; }
  .slide.active .cap > * { animation: rise .7s var(--ease) both; }
  .slide.active .cap h2 { animation-delay: .1s; }
  .slide.active .cap p { animation-delay: .18s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* Title (intro) + outro cards */
  .card { text-align: center; padding: 24px; max-width: 900px; }
  .card .logo { width: clamp(64px, 9vw, 96px); height: auto; border-radius: 22px; margin: 0 auto 26px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .card h1 { font-size: clamp(30px, 6vw, 64px); line-height: 1.04; letter-spacing: -.03em; font-weight: 800; margin-bottom: 18px; }
  .card h1 .grad { background: linear-gradient(120deg, var(--brand-light), var(--brand-dark)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .card p { color: var(--text-dim); font-size: clamp(15px, 2.2vw, 20px); max-width: 60ch; margin: 0 auto 30px; }
  .slide.active .card > * { animation: rise .8s var(--ease) both; }
  .slide.active .card h1 { animation-delay: .12s; }
  .slide.active .card p { animation-delay: .24s; }
  .slide.active .card .btns { animation-delay: .36s; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); padding: 6px 14px; border-radius: 999px; font-size: 13px; margin-bottom: 22px; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 10px #3fb950; }
  .btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; padding: 13px 24px; border-radius: 12px; border: 1px solid transparent; }
  .btn svg { width: 18px; height: 18px; }
  .btn-primary { background: linear-gradient(135deg, var(--brand-light), var(--brand-dark)); color: #0a0a0c; }
  .btn-ghost { background: var(--panel); color: var(--text); border-color: var(--border); }
  .plat { margin-top: 20px; color: #6e6e76; font-size: 13px; }

  /* ---- Controls ---- */
  .controls { display: flex; align-items: center; gap: 16px; padding-top: 22px; }
  .progress { flex: 1; display: flex; gap: 6px; }
  .seg { flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; cursor: pointer; }
  .seg i { display: block; height: 100%; width: 0; background: var(--brand-light); border-radius: 999px; }
  .seg.done i { width: 100%; }
  .seg.active i { animation: fill var(--dur) linear both; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }
  .paused .seg.active i { animation-play-state: paused; }

  .ctl { display: inline-flex; align-items: center; gap: 8px; }
  .ctl button {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--border); color: var(--text); cursor: pointer;
    transition: border-color .15s, background .15s, transform .12s var(--ease);
  }
  .ctl button:hover { border-color: #46464e; background: #17171b; }
  .ctl button:active { transform: scale(.94); }
  .ctl button svg { width: 18px; height: 18px; fill: currentColor; }

  .brand-mini { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
  .brand-mini img { width: 26px; height: 26px; border-radius: 7px; }
  .brand-mini small { display: block; font-size: 9px; letter-spacing: .18em; color: #6e6e76; font-weight: 600; }

  @media (max-width: 640px) {
    .brand-mini small { display: none; }
    .cap { padding: 20px 18px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .slide.active .shot img, .slide.active .cap > *, .slide.active .card > *, .seg.active i { animation: none; }
    .slide { transition: opacity .3s; }
    .seg.active i { width: 100%; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="stage" id="stage">
  <div class="slides" id="slides"><!-- slides injected by JS --></div>

  <div class="controls">
    <div class="brand-mini">
      <img src="assets/icon.svg" alt="" />
      <span>k8sight<small>KUBERNETES, IN SIGHT</small></span>
    </div>
    <div class="progress" id="progress"></div>
    <div class="ctl">
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6z"/></svg></button>
      <button id="play" aria-label="Play/Pause"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></button>
    </div>
  </div>
</div>

<script>
  const SCENE_MS = 6000;
  const REPO = 'https://github.com/praveenraghav01/k8sight';

  // Scene deck. `type:'title'` and `type:'outro'` render text cards; others show a screenshot.
  const scenes = [
    { type: 'title',
      badge: 'macOS · Windows · Linux',
      title: 'See your whole cluster in <span class="grad">one beautiful window</span>',
      sub: 'A native desktop app for browsing and operating any Kubernetes cluster from your local kubeconfig.' },
    { img: 'screenshot-dashboard-dark.png', kicker: 'Live dashboard',
      title: 'Your cluster, at a glance',
      sub: 'Node & pod health, workload charts and real capacity the moment you connect.' },
    { img: 'screenshot-topology-dark.png', kicker: 'Topology',
      title: 'See what talks to what',
      sub: 'Pan & zoom the graph of Deployment → ReplicaSet → Pod → Service relationships.' },
    { img: 'screenshot-cmdk-dark.png', kicker: 'Command palette',
      title: 'Jump anywhere with <kbd>⌘K</kbd>',
      sub: 'A Spotlight-style palette for every view, cluster and action — plus back/forward history.' },
    { img: 'screenshot-agent-dark.png', kicker: 'AI & agents',
      title: 'Coding agents, docked',
      sub: 'Claude Code, Copilot, Gemini, Codex and opencode open right beside the pod terminal.' },
    { img: 'screenshot-argocd-dark.png', kicker: 'GitOps',
      title: 'First-class Argo CD',
      sub: 'Auto-detected. Sync health, needs-attention, and one-click Sync / Refresh — no argocd CLI.' },
    { img: 'screenshot-argocd-tree-dark.png', kicker: 'Argo CD · resource tree',
      title: 'Track one app end to end',
      sub: 'An interactive tree of an Application and every resource it manages, colour-coded by health.' },
    { type: 'outro',
      title: 'Ready to see your cluster clearly?',
      sub: 'Free & open-source. Download for macOS, Windows or Linux.' },
  ];

  const slidesEl = document.getElementById('slides');
  const progressEl = document.getElementById('progress');
  document.documentElement.style.setProperty('--dur', SCENE_MS + 'ms');

  scenes.forEach((s, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    if (s.type === 'title') {
      slide.innerHTML = `<div class="card">
        <img class="logo" src="assets/icon.svg" alt="k8sight" />
        ${s.badge ? `<div class="badge"><span class="dot"></span>${s.badge}</div>` : ''}
        <h1>${s.title}</h1><p>${s.sub}</p></div>`;
    } else if (s.type === 'outro') {
      slide.innerHTML = `<div class="card">
        <img class="logo" src="assets/icon.svg" alt="k8sight" />
        <h1>${s.title}</h1><p>${s.sub}</p>
        <div class="btns">
          <a class="btn btn-primary" href="${REPO}/releases/latest" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Download k8sight</a>
          <a class="btn btn-ghost" href="${REPO}" target="_blank" rel="noopener">View on GitHub</a>
        </div>
        <div class="plat">macOS .dmg · Windows .exe · Linux .AppImage / .deb</div></div>`;
    } else {
      slide.innerHTML = `<div class="shot">
        <img src="assets/${s.img}" alt="${s.title.replace(/<[^>]+>/g, '')}" loading="lazy" />
        <div class="cap"><div class="kicker">${s.kicker}</div><h2>${s.title}</h2><p>${s.sub}</p></div></div>`;
    }
    slidesEl.appendChild(slide);

    const seg = document.createElement('div');
    seg.className = 'seg'; seg.innerHTML = '<i></i>';
    seg.addEventListener('click', () => go(i));
    progressEl.appendChild(seg);
  });

  const slides = [...slidesEl.children];
  const segs = [...progressEl.children];
  let idx = 0, timer = null, paused = false;

  function render() {
    slides.forEach((s, i) => s.classList.toggle('active', i === idx));
    segs.forEach((s, i) => {
      s.classList.toggle('active', i === idx);
      s.classList.toggle('done', i < idx);
    });
  }
  function schedule() {
    clearTimeout(timer);
    if (!paused) timer = setTimeout(() => go(idx + 1), SCENE_MS);
  }
  function go(n) {
    idx = (n + slides.length) % slides.length;
    render(); schedule();
  }
  function setPaused(p) {
    paused = p;
    document.getElementById('stage').classList.toggle('paused', p);
    document.getElementById('playIcon').setAttribute('d', p ? 'M8 5v14l11-7z' : 'M6 5h4v14H6zM14 5h4v14h-4z');
    if (p) clearTimeout(timer); else schedule();
  }

  document.getElementById('prev').addEventListener('click', () => go(idx - 1));
  document.getElementById('next').addEventListener('click', () => go(idx + 1));
  document.getElementById('play').addEventListener('click', () => setPaused(!paused));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(idx + 1);
    else if (e.key === 'ArrowLeft') go(idx - 1);
    else if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
  });

  render(); schedule();
</script>
</body>
</html>
