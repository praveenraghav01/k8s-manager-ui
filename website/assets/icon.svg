<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a8cff"/>
      <stop offset="0.5" stop-color="#326ce5"/>
      <stop offset="1" stop-color="#1b4fc4"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0a1f52" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="80" y="80" width="864" height="864" rx="196" ry="196" fill="url(#tile)"/>
  <rect x="80" y="80" width="864" height="864" rx="196" ry="196" fill="url(#sheen)"/>

  <!-- Kubernetes-style helm wheel (regular heptagon + 7 spokes + hub + rivets) -->
  <g transform="translate(512 512)" filter="url(#shadow)"
     fill="none" stroke="#ffffff" stroke-width="26"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- heptagon ring -->
    <polygon points="0,-300 234.5,-187.05 292.5,66.75 130.2,270.3 -130.2,270.3 -292.5,66.75 -234.5,-187.05"/>
    <!-- 7 spokes from hub toward each vertex -->
    <path d="M0,-70 L0,-262
             M60,-38 L204.5,-163.1
             M67,25 L255,58.2
             M40,58 L113.5,235.6
             M-40,58 L-113.5,235.6
             M-67,25 L-255,58.2
             M-60,-38 L-204.5,-163.1"/>
  </g>

  <!-- hub + rivets on top -->
  <g transform="translate(512 512)" fill="#ffffff" stroke="none" filter="url(#shadow)">
    <circle cx="0" cy="0" r="66"/>
    <circle cx="0" cy="-300" r="30"/>
    <circle cx="234.5" cy="-187.05" r="30"/>
    <circle cx="292.5" cy="66.75" r="30"/>
    <circle cx="130.2" cy="270.3" r="30"/>
    <circle cx="-130.2" cy="270.3" r="30"/>
    <circle cx="-292.5" cy="66.75" r="30"/>
    <circle cx="-234.5" cy="-187.05" r="30"/>
  </g>
  <!-- blue center dot for depth -->
  <circle cx="512" cy="512" r="26" fill="#2a5fd0"/>
</svg>
