<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kubernetes Manager</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000000;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .logo {
        width: 72px;
        height: 72px;
        color: #38bdf8;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      .title { font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
      .sub { font-size: 13px; color: #94a3b8; }
      .bar {
        width: 180px; height: 3px; border-radius: 3px;
        background: rgba(148,163,184,0.2); overflow: hidden;
      }
      .bar::after {
        content: ""; display: block; height: 100%; width: 40%;
        background: #e6e6ea; border-radius: 3px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 3 7v10l9 5 9-5V7l-9-5z" />
        <path d="M12 8v8M8 10v4M16 10v4" />
      </svg>
      <div class="title">Kubernetes Manager</div>
      <div class="bar"></div>
      <div class="sub">Starting the backend…</div>
    </div>
  </body>
</html>
